services:
  - type: web
    name: payshield-ai-backend
    runtime: python
    region: oregon
    plan: 0.5c-512mb
    branch: feat/premium-receipt-redesign
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: PAYSHIELD_DB_PATH
        value: /var/data/payshield_payments.sqlite3
      - key: PAYSHIELD_AUDIT_LOG
        value: /var/data/audit_log.jsonl
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYSHIELD_INTEGRATION_API_KEY
        sync: false
      - key: PAYSHIELD_ALLOW_DEMO_LOGIN
        value: "false"
      - key: PAYSHIELD_FRONTEND_URL
        value: https://payshield-ai-frontend.onrender.com
      - key: PAYSHIELD_ALLOWED_ORIGINS
        value: https://payshield-ai-frontend.onrender.com,http://localhost:3000,http://127.0.0.1:3000
    disk:
      name: payshield-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: payshield-ai-frontend
    runtime: static
    branch: feat/premium-receipt-redesign
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://payshield-ai-backend.onrender.com

